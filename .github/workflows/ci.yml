name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - run: npm ci
      - name: Read-only, network and dependency checks
        run: npm run check:readonly && npm run check:deps
      - run: npm run check
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: No file writes outside library.rs and log.rs
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -A clippy::all -D clippy::disallowed_methods
      - name: No file writes in the whole-app test build either (feature-gated code)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features e2e -- -A clippy::all -D clippy::disallowed_methods
      - name: Unit tests of the whole-app test hooks (e2e)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features e2e e2e::
      - name: Speed checks (search 5,000 documents under 200 ms, 1,000-file tree under 2 s)
        run: cargo test --release --manifest-path src-tauri/Cargo.toml speed -- --ignored --nocapture
      - name: Screens in WebKit and Chromium, with axe-core
        run: |
          npx playwright install --with-deps webkit chromium
          npm run test:web
      - name: Build (macOS, no whole-app tests there)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --no-bundle
      - name: Whole-app test tools (e2e)
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      # msedgedriver must match the WebView2 Runtime the app runs in, which can differ from Edge's own version.
      - name: Edge WebDriver for the WebView2 Runtime (e2e)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webview = (Get-ItemProperty $key).pv
          $edge = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe" -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
          "WebView2 Runtime $webview; Edge $edge"
          New-Item -ItemType Directory -Force e2e/.driver | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$webview/edgedriver_win64.zip" -OutFile e2e/.driver/edgedriver.zip
          Expand-Archive e2e/.driver/edgedriver.zip e2e/.driver -Force
          & e2e/.driver/msedgedriver.exe --version
      # Windows: since WebView2 Runtime 150 an elevated app ignores the WEBVIEW2_* variables msedgedriver uses to open
      # its DevTools port, and the runner is elevated; so the tests run at Medium integrity through gsudo (the workaround
      # in tauri-apps/wry#1782). Linux: without a session bus GLib waits 25 s for xdg-desktop-portal; give it one.
      - name: Whole-app test runner at Medium integrity (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gsudo --version=2.6.1 --no-progress -y
          'C:\tools\gsudo\Current' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH # later steps don't see choco's PATH change
          icacls "$env:GITHUB_WORKSPACE" /grant "${env:USERNAME}:(OI)(CI)F" /Q
      - name: Whole-app tests, start-up and tree speed (e2e)
        if: runner.os != 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            MARKVY_NATIVE_DRIVER=$(command -v WebKitWebDriver) dbus-run-session -- xvfb-run -a npm run test:e2e
          else
            gsudo --integrity Medium npm run test:e2e
          fi
      - name: Start-up speed without WebDriver (median of 3 under 1.5 s)
        if: runner.os != 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- xvfb-run -a npm run bench:startup
          else
            npm run bench:startup
          fi
