name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - run: npm ci
      - name: Read-only, network and dependency checks
        run: npm run check:readonly && npm run check:deps
      - run: npm run check
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: No file writes outside library.rs and log.rs
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -A clippy::all -D clippy::disallowed_methods
      - name: No file writes in the whole-app test build either (feature-gated code)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features e2e -- -A clippy::all -D clippy::disallowed_methods
      - name: Unit tests of the whole-app test hooks (e2e)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features e2e e2e::
      - name: Speed checks (search 5,000 documents under 200 ms, 1,000-file tree under 2 s)
        run: cargo test --release --manifest-path src-tauri/Cargo.toml speed -- --ignored --nocapture
      - name: Screens in WebKit and Chromium, with axe-core
        run: |
          npx playwright install --with-deps webkit chromium
          npm run test:web
      - name: Build (macOS, no whole-app tests there)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --no-bundle
      - name: Whole-app test tools (e2e)
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      # msedgedriver must match the WebView2 Runtime the app runs in. On a runner that can differ from Edge's own
      # version, which is what msedgedriver-tool reads; a mismatch fails every session with "DevToolsActivePort".
      - name: Edge WebDriver for the WebView2 Runtime (e2e)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webview = (Get-ItemProperty $key).pv
          $edge = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe" -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
          "WebView2 Runtime $webview; Edge $edge"
          New-Item -ItemType Directory -Force e2e/.driver | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$webview/edgedriver_win64.zip" -OutFile e2e/.driver/edgedriver.zip
          Expand-Archive e2e/.driver/edgedriver.zip e2e/.driver -Force
          & e2e/.driver/msedgedriver.exe --version
      - name: Whole-app tests, start-up and tree speed (e2e)
        if: runner.os != 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            MARKVY_NATIVE_DRIVER=$(command -v WebKitWebDriver) xvfb-run -a npm run test:e2e
          else
            npm run test:e2e
          fi
      # Only after a failed whole-app run on Windows: what the app and WebView2 did, for the log.
      - name: Windows whole-app diagnostics (after a failure)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem $env:TEMP -Directory -Filter 'markvy-e2e-*' | ForEach-Object {
            Get-ChildItem $_.FullName -Recurse -Filter markvy.log | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 } }
          "== Application errors in the last hour"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddHours(-1) } -MaxEvents 10 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message | Out-String -Width 300
          "== The app started directly, with a DevTools port"
          $env:MARKVY_DATA_DIR = Join-Path $env:TEMP 'markvy-diag'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $p = Start-Process src-tauri/target/release/markvy.exe -PassThru -RedirectStandardOutput diag-out.txt -RedirectStandardError diag-err.txt
          Start-Sleep -Seconds 20
          "app still running: $(-not $p.HasExited); exit code: $($p.ExitCode)"
          "== WebView2 browser process command lines"
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object CommandLine -notmatch '--type=' | ForEach-Object CommandLine
          try { (Invoke-WebRequest http://127.0.0.1:9222/json/version -UseBasicParsing).Content } catch { "no DevTools on 9222: $_" }
          Get-Content diag-out.txt, diag-err.txt -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          "== Edge and WebView2 policies"
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2') {
            if (Test-Path $k) { "-- $k"; Get-ItemProperty $k | Out-String; Get-ChildItem $k -Recurse | ForEach-Object { "-- $($_.Name)"; Get-ItemProperty $_.PSPath | Out-String } } }
          "== Elevated: $(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          "== Same start with a fresh WebView2 data folder"
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:TEMP 'markvy-diag-wv2'
          $p = Start-Process src-tauri/target/release/markvy.exe -PassThru
          Start-Sleep -Seconds 20
          try { (Invoke-WebRequest http://127.0.0.1:9222/json/version -UseBasicParsing).Content } catch { "no DevTools on 9222: $_" }
          Get-ChildItem $env:WEBVIEW2_USER_DATA_FOLDER -Filter DevToolsActivePort -Recurse -ErrorAction SilentlyContinue | ForEach-Object FullName
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
      # TEMPORARY: Linux start-up takes about 30 s on the runner (first paint at 30.8 s). Times one start per environment.
      - name: Linux start-up probe (temporary)
        if: runner.os == 'Linux' && always()
        continue-on-error: true
        run: |
          bin=src-tauri/target/release/markvy
          probe() {
            local start=$(date +%s%N)
            env MARKVY_E2E_STARTUP_EXIT=1 MARKVY_DATA_DIR="$(mktemp -d)" "$@" 2>&1 | grep -E 'BENCH|rror|WARN' | head -4
            echo "PROBE [$*] took $(( ($(date +%s%N) - start) / 1000000 )) ms"
          }
          probe xvfb-run -a timeout 60 "$bin"
          probe NO_AT_BRIDGE=1 xvfb-run -a timeout 60 "$bin"
          probe GTK_A11Y=none NO_AT_BRIDGE=1 xvfb-run -a timeout 60 "$bin"
          probe xvfb-run -a dbus-run-session -- timeout 60 "$bin"
          probe WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 xvfb-run -a timeout 60 "$bin"
          probe WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a timeout 60 "$bin"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unset}"
      - name: Start-up speed without WebDriver (median of 3 under 1.5 s)
        if: runner.os != 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run bench:startup
          else
            npm run bench:startup
          fi
